    - sidebar:
        heading: |-
          My current research program
        body: |-
          <p>Most of my current work focuses on arithmetic and geometric aspects of fundamental groups — that is, “anabelian geometry” — very broadly construed. I’m interested in connections to arithmetic, geometry, and topology.</p>
      groups:
        - heading: "papers on Arithmetic and topology of algebraic varieties"
          publications:
            - title: |-
                \(E_6\)-local systems from cubic threefolds
              citation: |-
                (<a href="https://arxiv.org/abs/2604.20970">arXiv version</a>, 2026, joint with <a href="https://www-user.tu-chemnitz.de/~kraet/">Thomas Krämer</a> and <a href="https://webusers.imj-prg.fr/~marco.maculan/">Marco Maculan</a>)
              abstract: |-
                We produce infinitely many local systems on (level covers of) the moduli space of smooth cubic threefolds, with algebraic monodromy group equal to the exceptional group \(E_6\). These local systems arise in the middle cohomology of abelian étale covers of the Fano scheme parametrizing lines in the universal cubic threefold.
            - title: |-
                \(p\)-curvature and non-abelian cohomology
              citation: |-
                (<a href="https://arxiv.org/abs/2601.07933">arXiv version</a>, 2026, joint with <a href="https://www.yhjlam.com/">Josh Lam</a>)
              abstract: |-
                Let \(X\to S\) be a smooth projective morphism. Katz proved the Grothendieck-Katz p-curvature conjecture for the Gauss-Manin connection on the i-th cohomology of X/S: if its p-curvature vanishes mod p for infinitely many p, then the action of \(\pi_1(S,s)\) on \(H^i(X_s,\mathbb{Z})\) factors through a finite group. We prove a non-abelian analogue of this statement: if the p-curvature of the isomonodromy foliation on the moduli of flat bundles of rank r on X/S vanishes mod p for infinitely many p, then the action of \(\pi_1(S,s)\) on the rank r integral characters of \(\pi_1(X_s)\) factors through a finite group. We deduce many new cases of the Bost/Ekedahl--Shepherd-Barron--Taylor conjecture. The proofs rely on a non-abelian version of Katz's formula, and a non-abelian version of the Hodge index theorem.
            - title: |-
                Density of integral points in the Betti moduli of quasi-projective varieties
              citation: |-
                (<a href="https://arxiv.org/abs/2507.00167">arXiv version</a>, 2025, joint with <a href="https://sites.google.com/view/simone-coccia/home">Simone Coccia</a>)
              abstract: |-
                Let Y be a smooth quasi-projective complex variety equipped with a simple normal crossings compactification. We show that integral points are potentially dense in the (relative) character varieties parametrizing \(SL_2\)-local systems on Y with fixed algebraic integer traces along the boundary components. The proof proceeds by using work of Corlette-Simpson to reduce to the case of Riemann surfaces, where we produce an integral point with Zariski-dense orbit under the mapping class group.
            - title: |-
                Algebraicity and integrality of solutions to differential equations
              citation: |-
                (<a href="https://arxiv.org/abs/2501.13175">arXiv version</a>, 2025, joint with <a href="https://www.yhjlam.com/">Josh Lam</a>)
              abstract: |-
                We formulate a conjecture classifying algebraic solutions to (possibly non-linear) algebraic differential equations, in terms of the primes appearing in the denominators of the coefficients of their Taylor expansion at a non-singular point. For linear differential equations, this conjecture is a strengthening of the Grothendieck-Katz p-curvature conjecture. We prove the conjecture for many differential equations and initial conditions of algebro-geometric interest. For linear differential equations, we prove it for Picard-Fuchs equations at initial conditions corresponding to cycle classes, among other cases. For non-linear differential equations, we prove it for isomonodromy differential equations, such as the Painlevé VI equation and Schlesinger system, at initial conditions corresponding to Picard-Fuchs equations. We draw a number of algebro-geometric consequences from the proofs.
            - title: |-
                Motives, mapping class groups, and monodromy
              citation: |-
                (<a href="https://arxiv.org/abs/2409.02234">arXiv version</a>, 2024)
              abstract: |-
                We survey some recent developments at the interface of algebraic geometry, surface topology, and the theory of ordinary differential equations. Motivated by "non-abelian" analogues of standard conjectures on the cohomology of algebraic varieties, we study mapping class group actions on character varieties and their algebro-geometric avatar -- isomonodromy differential equations -- from the point of view of both complex and arithmetic geometry. We then collect some open questions and conjectures on these topics. These notes are an extended version of my talk at the April 2024 Current Developments in Mathematics conference at Harvard.
            - title: |-
                Big monodromy for higher Prym representations
              citation: |-
                (accepted at <em>Geometry and Topology</em>, <a href="https://arxiv.org/abs/2401.13906">arXiv version</a>, 2024, joint with <a href="https://people.math.harvard.edu/~landesman/">Aaron Landesman</a> and <a href="https://williamsawin.com/">Will Sawin</a>)
              abstract: |-
                Let \(\Sigma_{g'}\to \Sigma_g\) be a cover of an orientable surface of genus g by an orientable surface of genus g', branched at n points, with Galois group H. Such a cover induces a virtual action of the mapping class group \(\text{Mod}_{g,n+1}\) of a genus g surface with n+1 marked points on \(H^1(\Sigma_{g'},\mathbb{C})\). When g is large in terms of the group H, we calculate precisely the connected monodromy group of this action. The methods are Hodge-theoretic and rely on a "generic Torelli theorem with coefficients."
              spacerParagraphs: 2
            - title: |-
                Finite braid group orbits on \(SL_2\)-character varieties
              citation: |-
                (<a href="https://arxiv.org/abs/2308.01376">arXiv version</a>, 2023, joint with <a href="https://www.yhjlam.com">Yeuk Hay Joshua Lam</a> and <a href="https://people.math.harvard.edu/~landesman/">Aaron Landesman</a>)
              abstract: |-
                Let X be a 2-sphere with n punctures. We classify all conjugacy classes of Zariski-dense representations \(\rho: \pi_1(X)\to SL_2(\mathbb{C})\) with finite orbit under the mapping class group of X, such that the local monodromy at one or more punctures has infinite order. We show that all such representations are "of pullback type" or arise via middle convolution from finite complex reflection groups. In particular, we classify all rank 2 local systems of geometric origin on the projective line with n generic punctures, and with local monodromy of infinite order about at least one puncture.
              spacerParagraphs: 2
            - title: |-
                Geometric local systems on the projective line minus four points
              citation: |-
                (accepted at <em>Compositio Mathematica, </em><a href="https://arxiv.org/abs/2305.11314">arXiv version</a>, 2023, joint with <a href="https://www.yhjlam.com">Yeuk Hay Joshua Lam</a>)
              abstract: |-
                Let \(J(m)\) be an \(m\times m\) Jordan block with eigenvalue 1. For \(\lambda\in \mathbb{C}\setminus \{0,1\}\), we explicitly construct all rank 2 local systems of geometric origin on \(\mathbb{P}^1\setminus\{0,1,λ,∞\}\), with local monodromy conjugate to \(J(2)\) at \(0,1,\lambda\) and conjugate to \(−J(2)\) at \(\infty\). The construction relies on Katz's middle convolution operation. We use our construction to prove two conjectures of Sun-Yang-Zuo (one of which was proven earlier by Lin-Sheng-Wang; the other was proven independently from us by Yang-Zuo).
              spacerParagraphs: 2
            - title: |-
                Prill’s problem
              citation: |-
                (accepted to Compositio, Algebraic Geometry, <a href="https://arxiv.org/abs/2209.12958">arXiv version</a>, 2022, joint with <a href="https://people.math.harvard.edu/~landesman/">Aaron Landesman</a>)
              abstract: |-
                We solve Prill's problem, originally posed by David Prill in the late 1970s and popularized in ACGH's "Geometry of Algebraic Curves." That is, for any curve \(Y\) of genus 2, we produce a finite étale degree 36 connected cover \(f: X\to Y\) where, for every point \( y \in Y, f^{-1}(y)\) moves in a pencil.
              spacerParagraphs: 2
            - title: |-
                An introduction to the algebraic geometry of the Putman-Wieland conjecture
              citation: |-
                (<a href="https://link.springer.com/article/10.1007/s40879-023-00637-w">European Journal of Mathematics</a>, 2023, <a href="https://arxiv.org/abs/2209.00717">arXiv version</a>, 2022, joint with <a href="https://people.math.harvard.edu/~landesman/">Aaron Landesman</a>)
              abstract: |-
                We give algebraic and geometric perspectives on our prior results toward the Putman-Wieland conjecture. This leads to interesting new constructions of families of "origami" curves whose Jacobians have high-dimensional isotrivial isogeny factors. We also explain how a hyperelliptic analogue of the Putman-Wieland conjecture fails, following work of Marković.
              spacerParagraphs: 2
            - title: |-
                Applications of the algebraic geometry of the Putman-Wieland conjecture
              citation: |-
                (<a href="https://londmathsoc.onlinelibrary.wiley.com/doi/full/10.1112/plms.12539">Proceedings of the LMS</a>, 2023, <a href="https://arxiv.org/abs/2209.00718">arXiv version</a>, 2022, joint with <a href="https://people.math.harvard.edu/~landesman/">Aaron Landesman</a>)
              abstract: |-
                We give three applications of our prior work toward the Putman-Wieland conjecture. First, we solve Prill's problem about special divisors on covers of curves. Next, we deduce a strengthening of a result of Marković-Tošić on virtual mapping class group actions on the homology of covers. Finally, we show that for \(g\geq 3\) and and \(\Sigma_{g',n'}\to \Sigma_{g, n}\) a finite \(H\)-cover of topological surfaces, the virtual action of the mapping class group of \(\Sigma_{g,n+1}\) on an \(H\)-isotypic component of \(H^1(\Sigma_{g'})\) has infinite image.
              spacerParagraphs: 2
            - title: |-
                <em>Canonical representations of surface groups</em>
              citation: |-
                (accepted at <em>Annals of Mathematics, </em><a href="https://arxiv.org/abs/2205.15352">arXiv version</a>, 2022, joint with <a href="https://people.math.harvard.edu/~landesman/">Aaron Landesman</a>)
              abstract: |-
                Let \(\Sigma_{g,n}\) be an orientable surface of genus \(g\) with \(n\) punctures. We study actions of the mapping class group \(\text{Mod}_{g,n}\) of \(\Sigma_{g,n}\) via Hodge-theoretic and arithmetic techniques. We show that if \(\rho: \pi_1(\Sigma_{g,n})\to \text{GL}_r(\mathbb{C})\) is a representation whose conjugacy class has finite orbit under \(\text{Mod}_{g,n}\), and \(r&lt; \sqrt{g+1}\), then \(\rho\) has finite image. This answers questions of Junho Peter Whang and Mark Kisin. We give applications of our methods to the Putman-Wieland conjecture, the Fontaine-Mazur conjecture, and a question of Esnault-Kerz. <br> The proofs rely on non-abelian Hodge theory, our earlier work on semistability of isomonodromic deformations, and recent work of Esnault-Groechenig and Klevdal-Patrikis on Simpson's integrality conjecture for cohomologically rigid local systems.
              spacerParagraphs: 2
            - title: |-
                <em>\(p\)-adic iterated integration on semi-stable curves</em>
              citation: |-
                (<a href="https://arxiv.org/abs/2202.05340">arXiv version</a>, 2022, joint with <a href="https://people.math.osu.edu/katz.60/">Eric Katz</a>)
              abstract: |-
                We reformulate the theory of p-adic iterated integrals on semistable curves using the unipotent log rigid fundamental group. This fundamental group carries Frobenius and monodromy operators whose basic properties are established. By identifying the Frobenius-invariant subgroup of the fundamental group with the fundamental group of the dual graph, we characterize Berkovich--Coleman integration, which is path-dependent, as integration along the Frobenius-invariant lift of a path in the dual graph. We demonstrate the basic properties for this integration theory. Vologodsky's path-independent integration theory which was previously described using a monodromy condition can now be identified as Berkovich--Coleman integration along a combinatorial canonical path arising from the theory of combinatorial iterated integration as developed by the first-named author and Cheng. We use this definition to lay the groundwork for computing iterated integrals.
              spacerParagraphs: 2
            - title: |-
                <em>Geometric local systems on very general curves and isomonodromy</em>
              citation: |-
                (accepted at <em>Journal of the AMS</em>, <a href="https://arxiv.org/abs/2202.00039">arXiv version</a>, 2022, joint with <a href="https://people.math.harvard.edu/~landesman/">Aaron Landesman</a> — see <a href="/s/isomonodromy-stability-hodge-theory-pre-parabolic-12-12-21.pdf">here</a> for a shorter version that only proves the main results with the assumption of unipotent monodromy at infinity)
              abstract: |-
                We show that the minimum rank of a non-isotrivial local system of geometric origin, on a suitably general \(n\)-pointed curve of genus \(g\), is at least \(2\sqrt{g+1}\). We apply this result to resolve conjectures of Esnault-Kerz and Budur-Wang. The main input is an analysis of stability properties of flat vector bundles under isomonodromic deformation, which additionally answers questions of Biswas, Heu, and Hurtubise.
              spacerParagraphs: 2
            - title: |-
                <em>Surface bundles and the section conjecture</em>
              citation: |-
                <em> </em>(<a href="https://arxiv.org/abs/2010.07331">arXiv version</a>, 2020, joint with <a href="https://as.vanderbilt.edu/math/bio/li-wanlin/">Wanlin Li</a>, <a href="https://nsalter.science.nd.edu/">Nick Salter</a>, and <a href="https://padmask.github.io/">Padma Srinivasan</a>, published in <a href="https://link.springer.com/article/10.1007/s00208-022-02421-9"><em>Mathematische Annalen</em></a>)
              abstract: |-
                We formulate a tropical analogue of Grothendieck's section conjecture: that for every stable graph \(\Gamma\) of genus \(g&gt;2\), and every field \(k\), the generic curve with reduction type \(\Gamma\) over \(k\) satisfies the section conjecture. We prove many cases of this conjecture. In so doing we produce many examples of curves satisfying the section conjecture over fields of geometric interest, and then over \(p\)-adic fields and number fields via a Chebotarev argument.<br>We construct two Galois cohomology classes \(o_1\) and \(\widetilde{o_2}\), which obstruct the existence of \(\pi_1\)-sections and hence of rational points. The first is an abelian obstruction, closely related to the period of a curve and to a cohomology class on the moduli space of curves \(\mathscr{M}_g\) studied by Morita. The second is a 2-nilpotent obstruction and appears to be new. We study the degeneration of these classes via topological techniques, and we produce examples of surface bundles over surfaces where these classes obstruct sections. We then use these constructions to produce curves over p-adic fields and number fields where each class obstructs \(\pi_1\)-sections and hence rational points.<br>Among our geometric results are a new proof of the section conjecture for the generic curve of genus \(g&gt;2\), and a proof of the section conjecture for the generic curve of even genus with a rational divisor class of degree one (where the obstruction to the existence of a section is genuinely non-abelian).
              spacerParagraphs: 2
            - title: |-
                <em>Level structures, arithmetic representations, and non-commutative Siegel linearization</em>
              citation: |-
                <em> </em>(<a href="https://arxiv.org/abs/2107.02213">arXiv version</a>, 2021, joint with <a href="https://bkadets.github.io">Borys Kadets</a>﻿, published in <a href="https://www.degruyter.com/document/doi/10.1515/crelle-2022-0028/html"><em>Journal für die reine und angewandte Mathematik - Crelle's Journal</em></a>)
              abstract: |-
                Let \(\ell\) be a prime, \(k\) a finitely generated field of characteristic different from \(\ell\), and \(X\) a smooth geometrically connected curve over \(k\). Say a semisimple representation of \(\pi_1^{et}(X_{\bar k})\) is arithmetic if it extends to a finite index subgroup of \(\pi_1^{et}(X)\). We show that there exists an effective constant \(N=N(X,\ell)\) such that any semisimple arithmetic representation of \(\pi_1^{et}(X_{\bar k})\) into \(GL_n(\mathbb{Z}_\ell)\), which is trivial mod \(\ell^N\), is in fact trivial. This extends a previous result of the second author from characteristic zero to all characteristics. The proof relies on a new noncommutative version of Siegel's linearization theorem and the \(\ell\)-adic form of Baker's theorem on linear forms in logarithms.
              spacerParagraphs: 2
            - title: |-
                <em>Representations of surface groups with universally finite mapping class group orbit</em>
              citation: |-
                <em> </em>(<a href="https://arxiv.org/abs/1907.03941">arXiv version</a>, joint with <a href="https://people.math.wisc.edu/lawrence/">Brian Lawrence</a>, <a href="https://www.intlpress.com/site/pub/pages/journals/items/mrl/content/vols/0029/0006/a007/index.php?mode=ns"><em>Mathematical Research Letters</em></a><em>, </em>2023)
              abstract: |-
                Let \(\Sigma_{g,n}\) be the orientable genus \(g\) surface with \(n\) punctures, such that \(2−2g−n &lt; 0 \). Let \[\rho:\pi_1(\Sigma_{g,n})\to GL_m(\mathbb{C})\] be a representation. Suppose that for each finite covering map \(f: \Sigma_{g′,n′}\to \Sigma_{g,n}\), the orbit of (the isomorphism class of) \(f_∗(\rho)\) under the mapping class group \(MCG(\Sigma_{g′,n′})\) of \(\Sigma_{g′,n′}\) is finite. Then we show that \(\rho\) has finite image. The result is motivated by the Grothendieck-Katz \(p\)-curvature conjecture, and gives a reformulation of the \(p\)-curvature conjecture in terms of isomonodromy.
            - title: |-
                <em>Arithmetic representations of fundamental groups II: finiteness</em>
              citation: |-
                <em> </em>(<a href="https://arxiv.org/abs/1809.03524">arXiv version</a>, 2021, <em>Duke Mathematics Journal</em> version <a href="https://projecteuclid.org/journals/duke-mathematical-journal/volume-170/issue-8/Arithmetic-representations-of-fundamental-groups-II-Finiteness/10.1215/00127094-2020-0086.short">here</a>)
              abstract: |-
                Let \(X\) be a smooth curve over a finitely generated field \(k\), and let \(\ell\) be a prime different from the characteristic of $k$. We analyze the dynamics of the Galois action on the deformation rings of mod \(\ell\) representations of the geometric fundamental group of \(X\). Using this analysis, we prove analogues of the Shafarevich and Fontaine-Mazur finiteness conjectures for function fields over algebraically closed fields in arbitrary characteristic, and a weak variant of the Frey-Mazur conjecture for function fields in characteristic zero. <br><br> For example, we show that if \(X\) is a normal, connected variety over \(\mathbb{C}\), the (typically infinite) set of representations of \(\pi_1(X^{\text{an}})\) into \(GL_n(\overline{\mathbb{Q}_\ell})\), which come from geometry, has no limit points. As a corollary, we deduce that if \(L\) is a finite extension of \(\mathbb{Q}_\ell\), then the set of representations of \(\pi_1(X^{\text{an}})\) into \(GL_n(L)\), which arise from geometry, is finite.
            - title: |-
                <em>Arithmetic representations of fundamental groups I</em>
              citation: |-
                (<a href="https://link.springer.com/article/10.1007/s00222-018-0810-4"><em>Inventiones Mathematicae</em></a><em> (or </em><a href="https://rdcu.be/18sU"><em>here</em></a><em>)</em>, 2018, <a href="https://arxiv.org/abs/1708.06827">arXiv version</a>)
              abstract: |-
                Let \(X\) be a normal algebraic variety over a finitely generated field \(k\) of characteristic zero, and let \(\ell\) be a prime. Say that a continuous \(\ell\)-adic representation \(\rho\) of \(\pi_1^{\text{et}}(X_{\bar k})\) is <em>arithmetic</em> if there exists a finite extension \(k'\) of \(k\) and a representation \(\gamma\) of the etale fundamental group of \(\pi_1^{\text{et}}(X_{k'})\), with \(\rho\) a subquotient of \(\gamma|_{\pi_1^{\text{et}}(X_{\bar k})}\). We show that there exists an integer \(N=N(X, \ell)\) such that every nontrivial, semisimple arithmetic representation of \(\pi_1^{\text{et}}(X_{\bar k})\) is nontrivial mod \(\ell^N\). As a corollary, we prove that any nontrivial \(\ell\)-adic representation of \(\pi_1^{\text{et}}(X_{\bar k})\) which <em>arises from geometry</em> is nontrivial mod \(\ell^N\).<br><br> This is a streamlined and completely rewritten account of the most interesting results in the paper below.
            - title: |-
                <em>Arithmetic restrictions on geometric monodromy</em>
              citation: |-
                <em> </em>(not intended for publication, <a href="https://arxiv.org/abs/1607.05740">arXiv version</a>)
              abstract: |-
                This is a leisurely account of the results in the paper above and some complements; some of what did not appear in the paper above will appear in its sequel, <em>Arithmetic representations of fundamental groups II</em>. This paper is not intended for publication.
            - title: |-
                <em>Integral points on algebraic subvarieties of period domains</em>
              citation: |-
                <em> </em>(<a href="https://link.springer.com/article/10.1007/s00229-023-01463-w"><em>manuscripta mathematica</em></a><em>, </em><a href="https://arxiv.org/abs/1907.13536">arXiv version here</a>, 2019, joint with <a href="https://www.agtz.mathematik.uni-mainz.de/arakelov-geometrie/junior-prof-dr-ariyan-javanpeykar/">Ariyan Javanpeykar</a>)
              abstract: |-
                We show that for a variety which admits a quasi-finite period map, finiteness (resp. non-Zariski-density) of \(S\)-integral points implies finiteness (resp. non-Zariski-density) of points over all \(\mathbb{Z}\)-finitely-generated integral domains of characteristic zero. Our proofs rely on foundational results in Hodge theory due to Deligne, Griffiths, and Schmid, as well as the recent resolution of Griffiths's conjecture by Bakker-Brunebarbe-Tsimerman. We give straightforward applications to Shimura varieties, locally symmetric varieties, and the moduli space of smooth hypersurfaces in projective space. Using similar arguments and results of Viehweg-Zuo, we obtain similar arithmetic finiteness (resp. non-Zariski-density) statements for complete subvarieties of the moduli of canonically polarized varieties.
              quoted: false
            - title: |-
                <em>Tamely ramified morphisms of curves and Belyi’s theorem in positive characteristic</em>
              citation: |-
                <em> </em>(<a href="https://arxiv.org/abs/2010.01130">arXiv version</a>, 2020, joint with <a href="https://kskedlaya.org/">Kiran Kedlaya</a> and <a href="http://www-personal.umich.edu/~jakubw/">Jakub Witaszek</a>, published in <a href="https://academic.oup.com/imrn/advance-article-abstract/doi/10.1093/imrn/rnab309/6432387">IMRN</a>)
              abstract: |-
                We show that every smooth projective curve over a finite field \(k\) admits a finite tame morphism to the projective line over \(k\). Furthermore, we construct a curve with no such map when \(k\) is an infinite perfect field of characteristic two. Our work leads to a refinement of the tame Belyi theorem in positive characteristic, building on results of Saïdi, Sugiyama-Yasuda, and Anbar-Tutdere.
            - title: |-
                <em>Group-theoretic Johnson classes and a non-hyperelliptic curve with torsion Ceresa class</em>
              citation: |-
                <em> </em>(<a href="https://epiga.episciences.org/11131/pdf">EPIGA</a>, <a href="https://arxiv.org/abs/2004.06146">arXiv version</a>, 2020, joint with <a href="https://www.math.colostate.edu/~bisogno/">Dean Bisogno</a>, <a href="https://as.vanderbilt.edu/math/bio/li-wanlin/">Wanlin Li</a>, and <a href="https://padmask.github.io/">Padma Srinivasan</a>)
              abstract: |-
                Let \(\ell\) be a prime and \(G\) a pro-\(\ell\) group with torsion-free abelianization. We produce group-theoretic analogues of the Johnson/Morita cocycle for G -- in the case of surface groups, these cocycles appear to refine existing constructions when \(\ell=2\). We apply this to the pro-\(\ell\) étale fundamental groups of smooth curves to obtain Galois-cohomological analogues, and discuss their relationship to work of Hain and Matsumoto in the case the curve is proper. We analyze many of the fundamental properties of these classes and use them to give an example of a non-hyperelliptic curve whose Ceresa class has torsion image under the \(\ell\)-adic Abel-Jacobi map.
            - title: |-
                <em>Semisimplicity and weight-monodromy for fundamental groups</em>
              citation: |-
                <em> </em>(<a href="https://arxiv.org/abs/1912.02167">arXiv version</a>, joint with <a href="https://nms.kcl.ac.uk/alexander.betts/index.html">Alexander Betts</a>, 2019, appeared in <a href="https://link.springer.com/chapter/10.1007/978-3-031-21550-6_2">Proceedings of the Simons Symposium on p-adic Hodge Theory</a>)
              abstract: |-
                Let \(X\) be a smooth, geometrically connected variety over a \(p\)-adic local field \(K\). We show that the pro-unipotent fundamental group of \(X\) (in both the etale and crystalline settings) satisfies the weight-monodromy conjecture, following Vologodsky. We deduce (in the etale setting) that Frobenii act semisimply on the Lie algebra of the pro-unipotent fundamental group of \(X\), and (in the crystalline setting) that the same is true for a \(K\)-linear power of the crystalline Frobenius. We give applications to the representability and geometry of the Selmer varieties appearing in the Chabauty-Kim program, even in cases of bad reduction. .
              quoted: false
        - heading: "Writing on AI"
          publications:
            - title: |-
                Remarks on the disproof of the unit distance conjecture
              citation: |-
                (<a href="https://arxiv.org/abs/2605.20695">arXiv version</a>, 2026, joint with <a href="https://arxiv.org/search/math?searchtype=author&amp;query=Alon,+N">Noga Alon</a>, <a href="https://arxiv.org/search/math?searchtype=author&amp;query=Bloom,+T+F">Thomas F. Bloom</a>, <a href="https://arxiv.org/search/math?searchtype=author&amp;query=Gowers,+W+T">W. T. Gowers</a>, <a href="https://arxiv.org/search/math?searchtype=author&amp;query=Sawin,+W">Will Sawin</a>, <a href="https://arxiv.org/search/math?searchtype=author&amp;query=Shankar,+A">Arul Shankar</a>, <a href="https://arxiv.org/search/math?searchtype=author&amp;query=Tsimerman,+J">Jacob Tsimerman</a>, <a href="https://arxiv.org/search/math?searchtype=author&amp;query=Wang,+V">Victor Wang</a>, and <a href="https://arxiv.org/search/math?searchtype=author&amp;query=Wood,+M+M">Melanie Matchett Wood</a>)
              abstract: |-
                We present a short, digested, human-verified version of the recent OpenAI-generated counterexample to the Erdős unit distance conjecture, and a sequence of reflections on it. The argument relies crucially on ideas that may, at least in retrospect, be attributed to Ellenberg-Venkatesh, Golod-Shafarevich, and Hajir-Maire-Ramakrishna.
              quoted: false
    - sidebar:
        heading: |-
          Classical Algebraic Geometry
        body: |-
          <p>I have pretty broad algebro-geometric interests: Lefschetz theorems, positivity and vanishing theorems for vector bundles in positive characteristic, the fine classification of algebraic varieties, algebraic dynamics, and birational geometry.</p>
      groups:
        - heading: "Miscellaneous"
          publications:
            - title: |-
                <em>The Manin-Mumford conjecture in genus 2 and rational curves on K3 surfaces </em>
              citation: |-
                (<a href="https://arxiv.org/abs/2208.08729">arXiv version</a>, 2022, joint with Philip Engel and Raju Krishnamoorthy)
              abstract: |-
                Let A be a simple abelian surface over an algebraically closed field k. Let \(S\subset A(k)\) be the set of torsion points of A contained in the image of a map from a genus 2 curve C to A, sending a Weierstrass point of C to the origin. The purpose of this note is to show that if k has characteristic zero, then S is finite --- this is in contrast to the situation where k is the algebraic closure of a finite field, where \(S=A(k)\), as shown by Bogomolov and Tschinkel. We deduce that if \(k=\overline{\mathbb{Q}}\), the Kummer surface associated to A has infinitely many k-points not contained in a rational curve arising from a genus 2 curve in A, again in contrast to the situation over the algebraic closure of a finite field.
        - heading: "Vanishing and positivity"
          publications:
            - title: |-
                <em>Vanishing for Frobenius twists of ample vector bundles</em>
              citation: |-
                <em> </em>(<a href="https://projecteuclid.org/euclid.tmj/1576724793"><em>Tohoku Math Journal</em></a><em>, </em>2018, <a href="https://arxiv.org/abs/1702.03962">arXiv version</a>)
              abstract: |-
                This note proves several asymptotic vanishing theorems for Frobenius twists of ample vector bundles in positive characteristic. As an application, I prove a generalization of the Bott-Danilov-Steenbrink vanishing theorem for ample vector bundles on toric varieties.
            - title: |-
                <em>Non-abelian Lefschetz hyperplane theorems</em>
              citation: |-
                <em> </em>(<a href="http://www.ams.org/journals/jag/0000-000-00/S1056-3911-2018-00704-0/"><em>Journal of Algebraic Geometry</em></a>, 2018, <a href="https://arxiv.org/abs/1601.07914">arXiv version</a>)
              abstract: |-
                This is the edited version of my thesis, the goal of which was to prove a Lefschetz hyperplane theorem for any representable functor. Given a smooth projective variety \(X\) and an ample divisor \(D\) in \(X\), we study the problem of extending a map \(D\to Y\) to a map \(X\to Y\). This is mainly interesting when \(Y\) is a moduli space. The Lefschetz hyperplane theorem for the etale fundamental group is a corollary of the main result (taking \(Y=BG\) for \(G\) a finite group); we get many more Lefschetz theorems as well. For example, we find Lefschetz theorems for extending families of curves from an ample divisor, extending sections to certain maps, extending maps to varieties (DM stacks) with nef cotangent bundle, and so on. The main results are in characteristic zero, but the proofs pass through positive characteristic.
            - title: |-
                <em>Manifolds containing an ample \(\mathbb{P}^1\)-bundle</em>
              citation: |-
                (<a href="https://link.springer.com/article/10.1007/s00229-016-0872-9"><em>Manuscripta Mathematica</em></a><em>, </em>2017, <a href="https://arxiv.org/abs/1602.00716">arXiv version</a>)
              abstract: |-
                Sommese gives a conjectural classification of manifolds containing a projective bundle as an ample divisor; I prove his conjecture in many new cases, and I prove it in general assuming a natural conjectural characterization of projective space, along the lines of the famous characterization due to Andreatta and Wisniewski. (Update 11/2016: This conjectural characterization is now a theorem, <a href="https://www.cambridge.org/core/journals/nagoya-mathematical-journal/article/characterization-of-projective-spaces-and-mathbbpr-bundles-as-ample-divisors/62E6915BFF94C14809F0E3AF3603A29B">due to Jie Liu</a> (<a href="https://arxiv.org/abs/1611.05823">arXiv version</a>). Thus Sommese's conjecture is now a theorem as well.)
        - heading: "Dynamics"
          publications:
            - title: |-
                <em>Dynamical Mordell-Lang and automorphisms of blowups </em>
              citation: |-
                (joint with <a href="https://jlesieutre.github.io/">John Lesieutre</a>, <a href="http://content.algebraicgeometry.nl/2019-1/2019-1-001.pdf"><em>Algebraic Geometry, Foundation Compositio Mathematica</em></a>, 2016, <a href="https://arxiv.org/abs/1604.08216">arXiv version</a>)
              abstract: |-
                We prove a non-reduced analogue of the dynamical Mordell-Lang conjecture, via \(p\)-adic methods. We use this to place restrictions on the dynamics of the exceptional divisor of a blowup under the action of a regular automorphism. As a consequence, we show that certain blowups (e.g. blowups in high codimension) do not alter the finiteness of the automorphism group, extending results of Bayraktar-Cantat. We also generalize results of Arnol'd on the growth of multiplicities of the intersection of a variety with the iterates of some other variety under an automorphism.
        - heading: "The Grothendieck ring of varieties"
          publications:
            - title: |-
                <em>Zeta functions of curves with no rational points </em>
              citation: |-
                (<a href="https://projecteuclid.org/euclid.mmj/1434731929"><em>Michigan Math Journal</em></a><em>, </em>2015, <a href="https://arxiv.org/abs/1405.7380">arXiv version</a>)
              abstract: |-
                Kapranov showed that his motivic zeta function (a geometric analogue of the zeta function of a variety over a finite field) is rational for smooth curves which have a rational point. By analyzing the classes of certain Severi-Brauer schemes in the Grothendieck ring of varieties, I show that the same thing is true without the assumption of the existence of a rational point.
            - title: |-
                <em>Symmetric powers do not stabilize </em>
              citation: |-
                (<a href="http://www.ams.org/journals/proc/2014-142-12/S0002-9939-2014-12155-1/"><em>Proceedings of the AMS</em></a><em>, </em>2014, <a href="https://arxiv.org/abs/1209.4708">arXiv version</a>)
              abstract: |-
                My advisor, <a href="http://math.stanford.edu/~vakil/">Ravi Vakil</a>, conjectured that the classes of the symmetric powers of a variety "stabilize" in the Grothendieck ring, in a certain sense. I show that the answer to this question is "no" if one asks this stabilization question in a slightly different way, and conditional on various (very difficult) questions about the Grothendieck ring of varieties, that the answer to the original question is "no" as well. On the other hand, I show that these stabilization questions are controlled by the Hodge theory of the variety, and give an analogue of the famous "Newton above Hodge" theorem in the Grothendieck ring. <a href="http://scgp.stonybrook.edu/video_portal/video.php?id=974">Here is a video</a> of me talking about this paper.
